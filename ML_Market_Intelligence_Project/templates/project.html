{% extends "base.html" %}

{% block content %}

<section class="form-page">

    <div class="form-intro">
        <span class="milestone-label">MILESTONE 1 • PROJECT INPUT</span>
        <h1>Project Submission</h1>
        <p>
            Enter your startup or project information.
            The data will be stored in PostgreSQL and displayed on the dashboard.
        </p>
    </div>

    <form class="project-form" method="POST"
          action="{{ url_for('project') }}">

        <div class="form-grid">

            <div class="form-group full">
                <label for="startup_name">
                    Startup / Project Name <span>*</span>
                </label>
                <input
                    id="startup_name"
                    type="text"
                    name="startup_name"
                    placeholder="e.g. TechVentures AI"
                    required>
            </div>


            <div class="form-group">
                <label for="industry">
                    Industry / Sector <span>*</span>
                </label>

                <select id="industry" name="industry" required>
                    <option value="">Select industry</option>
                    <option>Technology</option>
                    <option>Education</option>
                    <option>Healthcare</option>
                    <option>Finance</option>
                    <option>Retail</option>
                    <option>Manufacturing</option>
                    <option>Transportation</option>
                </select>
            </div>


            <div class="form-group">
                <label for="business_model">
                    Business Model <span>*</span>
                </label>

                <select id="business_model" name="business_model" required>
                    <option value="">Select model</option>
                    <option>SaaS</option>
                    <option>B2B</option>
                    <option>B2C</option>
                    <option>Marketplace</option>
                    <option>Subscription</option>
                </select>
            </div>


            <div class="form-group">
                <label for="target_market">Target Market</label>

                <input
                    id="target_market"
                    type="text"
                    name="target_market"
                    placeholder="e.g. SMEs">
            </div>


            <div class="form-group">
                <label for="budget">Budget (USD)</label>

                <input
                    id="budget"
                    type="number"
                    name="budget"
                    min="0"
                    placeholder="e.g. 100000">
            </div>


            <div class="form-group full">
                <label for="description">Project Description</label>

                <textarea
                    id="description"
                    name="description"
                    rows="3"
                    placeholder="Brief description of your project idea..."></textarea>
            </div>

        </div>


        <div class="form-actions">
            <a class="secondary-button"
               href="{{ url_for('dashboard') }}">
                Cancel
            </a>

            <button class="primary-button" type="submit">
                Submit Project →
            </button>
        </div>

    </form>

</section>

{% endblock %}
